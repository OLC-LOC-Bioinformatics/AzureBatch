name: Build and Publish Conda Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: conda-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: azure_batch_build
          python-version: "3.12"
          auto-activate-base: false
          channels: olcbioinformatics,bioconda,conda-forge
          channel-priority: strict

      - name: Install pinned build tools
        run: |
          set -euo pipefail

          conda install -y -n base -c conda-forge \
            "conda-build=25.1.1" \
            "anaconda-client=1.14.1"

          conda info
          conda list -n base conda-build anaconda-client
          conda build --version
          anaconda --version

      - name: Validate and record release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download and hash release source
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SOURCE_URL="https://github.com/${REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output source.tar.gz \
            "$SOURCE_URL"

          SOURCE_SHA256="$(sha256sum source.tar.gz | awk '{print $1}')"

          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

      - name: Render and validate Conda recipe
        run: |
          set -euo pipefail

          test -n "$PACKAGE_VERSION"
          test -n "$SOURCE_URL"
          test -n "$SOURCE_SHA256"

          conda render recipes

      - name: Determine package output path
        run: |
          set -euo pipefail

          PACKAGE_PATH="$(conda build recipes --package-format 2 --output)"
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
          echo "Package will be written to: $PACKAGE_PATH"

          if [[ "$PACKAGE_PATH" != *.conda ]]; then
            echo "Expected a .conda package, got: $PACKAGE_PATH" >&2
            exit 1
          fi

      - name: Build and run recipe tests
        run: |
          set -euo pipefail

          conda config --set anaconda_upload no
          conda build recipes --package-format 2

          test -f "$PACKAGE_PATH"

      - name: Test installation from local build
        run: |
          set -euo pipefail

          conda create -y -n azure_batch_package_test \
            --use-local \
            "azure_batch=${PACKAGE_VERSION}"

          conda run -n azure_batch_package_test \
            python -c "import azure_batch; print(azure_batch.__file__)"

          conda run -n azure_batch_package_test AzureBatch -h

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-batch-${{ env.PACKAGE_VERSION }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload package to olcbioinformatics
        env:
          ANACONDA_API_TOKEN: ${{ secrets.OLCBIOINFORMATICS_ANACONDA_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$ANACONDA_API_TOKEN"
          test -f "$PACKAGE_PATH"

          anaconda -t "$ANACONDA_API_TOKEN" upload \
            -u olcbioinformatics \
            "$PACKAGE_PATH"
